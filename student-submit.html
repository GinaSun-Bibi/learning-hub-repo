    <main class="assignment-submit-card">
        <form id="submit-form">

            <h1>SUBMIT YOUR ASSIGNMENT</h1>

            <label for="submit-name">Assignment Name: </label>
            <input required type="text" id="submit-name" name="submit-name" placeholder="Please enter your assignment name: ">
            
            <label for="assignment-submit-upload">Choose a File: </label>
            <input required type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" id="assignment-submit-upload" name="assignment-submit">

            <button type="button" id="submit-button">UPLOAD</button>

            </form>
    </main>


     <div id="chatbot">

                <div id="chatbot-conversation"></div>
    
                <img src="images/bot.jpg" class="bot-image" alt="a bot photo">
                <input type="text" id="chatbot-message" placeholder="Please type your question here">
                
                <button type="button" id="chatbot-button"> SEND </button>
            </div>
</body>
