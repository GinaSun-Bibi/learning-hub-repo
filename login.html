<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="styles/styles.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="scripts/login.js"></script>

</head>
<body>
    <main class="login-page-container">
        <section class="login-page-card">
    
    <form id="login-form">
        <h1> Welcome To Learning Hub</h1>
        <div class="login-form-group">
        <label for="user-name-login">User Name:</label>
        <div class="icon-wrapper">
        <input required type="text" id="user-name-login" > <span class="search-icon" title="user name is your student/staff number">🔍</span>
        </div>
        </div>

        <div class="login-form-group">
        <label for="user-password">Password: </label>
        <input required type="password" id="user-password">
        </div>

        <div class="login-button-div">
       <button type="submit" id="login-button">Submit</button>
       <p id="welcome-message"></p>
       </div>


    </form>
</section>
</main>



    
</body>
</html>
